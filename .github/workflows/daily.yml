name: Collect CVbankas Vacancy Statistics

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: 'cvbankas-collector'
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, dom, mbstring, curl
          coverage: none

      - name: Install dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Run collector
        run: php bin/console.php collect

      - name: Commit and push data updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cvbankas.sqlite web/data/history.json web/data/latest.json web/data/others.json
          if git diff --staged --quiet; then
            echo "No changes in collected data."
          else
            git commit -m "chore(data): daily cvbankas statistics update [skip ci]"
            git push
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web'

      - name: Notify on failure via GitHub Issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date +'%Y-%m-%d')
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING_ISSUE=$(gh issue list --state open --search "CVbankas collection failed" --json number -q '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING_ISSUE" ]; then
            gh issue comment "$EXISTING_ISSUE" --body "⚠️ Run on **$DATE** also failed: [View run logs]($RUN_URL)"
          else
            gh issue create \
              --title "🚨 [Crawl Failure] CVbankas collection failed on $DATE" \
              --body "### Automated Crawl Failure Alert
          The daily CVbankas IT vacancy collector workflow failed on **$DATE**.

          - **Workflow Run:** [View run logs]($RUN_URL)
          - **Trigger:** \`${{ github.event_name }}\`
          - **Commit:** \`${{ github.sha }}\`

          GitHub has automatically dispatched this notification to your email. Please inspect the workflow run logs to diagnose whether cvbankas.lt changed its markup, experienced rate-limiting, or encountered network errors." \
              --label "bug"
          fi

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
